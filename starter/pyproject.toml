[project]
name = "biotrackr-starter"
version = "0.1.0"
description = "Biotrackr chat agent, naive but plausible starter (insecure on purpose)"
readme = "README.md"
requires-python = ">=3.12"
# ASI04 (starter): open-ended >= ranges, so any new release (or a hijacked one) flows straight in.
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-openai>=1.17.0",
    "agent-framework-ag-ui>=1.6.0",
    "agent-framework-devui>=1.0.0b261015",
    # Upper bound only because MAF's MCP client breaks on mcp 2.x.
    "mcp>=1.24,<2",
    "azure-cosmos>=4.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_api", "src/health_mcp", "src/seed"]

[tool.ruff]
extend = "../ruff.toml"
