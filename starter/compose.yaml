name: biotrackr-starter

x-app: &app
  image: localhost/biotrackr-starter:dev
  build:
    context: .
    dockerfile: Containerfile
  env_file: .env
  environment: &app-env
    COSMOS_ENDPOINT: http://cosmos:8081
    COSMOS_DATABASE: biotrackr
    OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

services:
  # ASI10 (starter): local traces expose prompts and health records in the GenAI visualizer.
  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:13.6.2
    ports:
      - "127.0.0.1:18888:18888"
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:1234:1234"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  seed:
    <<: *app
    command: ["python", "-m", "seed"]
    volumes:
      - ../data/seed:/data/seed:ro
    environment:
      <<: *app-env
      SEED_DIR: /data/seed
    depends_on:
      cosmos:
        condition: service_healthy
    restart: "no"

  health-mcp:
    <<: *app
    command: ["python", "-m", "health_mcp"]
    # ASI04 (starter): optional rugpull.env rewrites tool descriptions at deploy time; nothing pins them.
    env_file:
      - .env
      - path: rugpull.env
        required: false
    # ASI03 (starter): the MCP server is published to the host with no auth at all.
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      aspire-dashboard:
        condition: service_started
      seed:
        condition: service_completed_successfully

  chat-api:
    <<: *app
    command: ["python", "-m", "chat_api"]
    environment:
      <<: *app-env
      MCP_URL: http://health-mcp:8001/mcp
      REPORT_AGENT_URL: http://report-agent:8002/
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/liveness')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      aspire-dashboard:
        condition: service_started
      health-mcp:
        condition: service_healthy
      report-agent:
        condition: service_healthy

  # ASI10 (starter): opt-in DevUI exports content-visible traces over the stack network.
  devui:
    <<: *app
    profiles: [devui]
    command: ["python", "-m", "chat_api.devui_main"]
    environment:
      <<: *app-env
      MCP_URL: http://health-mcp:8001/mcp
      REPORT_AGENT_URL: http://report-agent:8002/
      DEVUI_HOST: 0.0.0.0
      DEVUI_OPEN: "0"
      OTEL_SERVICE_NAME: biotrackr-devui
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      aspire-dashboard:
        condition: service_started
      health-mcp:
        condition: service_healthy
      report-agent:
        condition: service_healthy

  report-agent:
    <<: *app
    command: ["python", "-m", "report_agent"]
    environment:
      <<: *app-env
      REPORT_AGENT_URL: http://report-agent:8002/
      # ASI05: a stand-in secret. Generated chart code runs in this process, so it can read it.
      REPORT_AGENT_CANARY: CANARY-ENV-R5X
    # ASI07 (starter): published with no auth; anyone on the host can send it tasks.
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      aspire-dashboard:
        condition: service_started
