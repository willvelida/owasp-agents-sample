[project]
name = "biotrackr-solution"
version = "0.1.0"
description = "Biotrackr chat agent, hardened solution for the OWASP Top 10 for Agentic Applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# ASI04: exact pins; uv.lock records hashes for every transitive dependency.
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "agent-framework-ag-ui==1.6.0",
    "agent-framework-devui==1.0.0b261015",
    "agent-governance-toolkit-core==5.0.0",
    "agent-governance-toolkit-cli==5.0.0",
    "mcp==1.30.0",
    "azure-cosmos==4.17.1",
    "azure-identity==1.26.0",
    "pyjwt[crypto]==2.15.1",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_api", "src/health_mcp", "src/seed", "src/local_issuer", "src/auth_common", "src/governance"]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
