name: biotrackr-solution

# Entra mode (default):  podman compose up --build -d
# Offline mode:          $env:IDENTITY_MODE = "local"; podman compose --profile offline up --build -d
# One-time az login:     podman compose --profile login run --rm az-login

x-app: &app
  image: localhost/biotrackr-solution:dev
  build:
    context: .
    dockerfile: Containerfile
    # The dev stage adds Azure CLI for DefaultAzureCredential; Azure images use the runtime stage.
    target: dev
  env_file: .env
  environment: &app-env
    COSMOS_ENDPOINT: http://cosmos:8081
    COSMOS_DATABASE: biotrackr
    IDENTITY_MODE: ${IDENTITY_MODE:-entra}
    LOCAL_ISSUER_URL: http://local-issuer:8100
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:1234:1234"
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  seed:
    <<: *app
    command: ["python", "-m", "seed"]
    volumes:
      - ../data/seed:/data/seed:ro
    environment:
      <<: *app-env
      SEED_DIR: /data/seed
    networks: [app]
    depends_on:
      cosmos:
        condition: service_healthy
    restart: "no"

  # ASI07: one-shot A2A key generation. The private key goes to a volume only chat-api mounts; the public key to
  # one only report-agent mounts. The key is created once and kept across restarts (delete the volume to rotate).
  a2a-keys:
    <<: *app
    command:
      - python
      - -m
      - report_agent.a2a_security
      - keygen
      - --private
      - /keys/signing/signing.key
      - --public
      - /keys/verify/verify.pub
    volumes:
      - a2a-signing:/keys/signing
      - a2a-verify:/keys/verify
    network_mode: none
    restart: "no"

  health-mcp:
    <<: *app
    command: ["python", "-m", "health_mcp"]
    # ASI04: the same optional rugpull.env as the starter has no effect here. Descriptions are static
    # and checked against policies/mcp_tools.lock.json at startup (exit non-zero on mismatch).
    env_file:
      - .env
      - path: rugpull.env
        required: false
    environment:
      <<: *app-env
      MCP_ALLOWED_HOSTS: health-mcp:8001,health-mcp
      MCP_RESOURCE_URL: http://health-mcp:8001/mcp
    # ASI03: published for DevUI on the host only; every call still needs an OBO bearer token.
    ports:
      - "127.0.0.1:8001:8001"
    networks: [app, identity]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      seed:
        condition: service_completed_successfully

  chat-api:
    <<: *app
    command: ["python", "-m", "chat_api"]
    environment:
      <<: *app-env
      MCP_URL: http://health-mcp:8001/mcp
      REPORT_AGENT_URL: http://report-agent:8002/
      SIDECAR_URL: http://localhost:5000
      # ASI10: kill switch. Set AGENT_KILL_SWITCH=on, then recreate chat-api and its sidecar (solution README, Operations).
      AGENT_KILL_SWITCH: ${AGENT_KILL_SWITCH:-off}
      # ASI07: Ed25519 key that signs every A2A request (report_agent/a2a_security.py).
      A2A_SIGNING_KEY_FILE: /run/a2a/signing/signing.key
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # ADR-0022: the developer's az login, cached by the az-login service. Read-write because az
      # refreshes its MSAL cache on each token request. Dev profile only, never in an Azure image.
      - azcli-cache:/home/app/.azure
      - a2a-signing:/run/a2a/signing:ro
    networks: [app, identity]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/liveness')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      health-mcp:
        condition: service_healthy
      report-agent:
        condition: service_healthy
      a2a-keys:
        condition: service_completed_successfully

  # ASI07: A2A only with an app-only token for the report API from the chat agent identity, plus a fresh,
  # single-use signature from chat-api over the exact body (public key only here).
  # ASI05: never runs generated code itself; it sends checked code to chart-runner over a Unix socket.
  # Not published to the host; the red-team oracle goes through chat-api's authenticated diagnostics route.
  report-agent:
    <<: *app
    command: ["python", "-m", "report_agent"]
    environment:
      <<: *app-env
      REPORT_AGENT_URL: http://report-agent:8002/
      CHART_RUNNER_SOCKET: /sockets/chart/runner.sock
      A2A_VERIFY_KEYS_FILE: /run/a2a/verify/verify.pub
      # ASI05: the same stand-in secret as the starter, so a blocked attack proves the control, not a missing secret.
      REPORT_AGENT_CANARY: CANARY-ENV-R5X
    volumes:
      - azcli-cache:/home/app/.azure
      - chart-socket:/sockets/chart
      - a2a-verify:/run/a2a/verify:ro
    networks: [app, identity]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      chart-runner:
        condition: service_healthy
      a2a-keys:
        condition: service_completed_successfully

  # ASI05: isolated chart runner. Its own minimal image (chart_runner.Containerfile), no network at all, read-only,
  # non-root (UID 10001, same as report-agent so the socket permissions match), no capabilities, process,
  # CPU, and memory limits, and no environment from .env. Each job runs in a fresh worker process with an
  # empty environment and a 10 s wall clock. No Podman or Docker socket is mounted into any service.
  chart-runner:
    image: localhost/biotrackr-chart-runner:dev
    build:
      context: .
      dockerfile: chart_runner.Containerfile
    command: ["python", "-m", "chart_runner", "--uds", "/sockets/chart/runner.sock"]
    user: "10001:10001"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - chart-socket:/sockets/chart
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/sockets/chart/runner.sock')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ASI03: Microsoft Entra SDK for AgentID. Performs OBO as the chat agent identity. It shares chat-api's
  # network namespace and listens on 127.0.0.1 only (it rejects non-loopback callers), the same topology as
  # the Container Apps replica. No published port, and no other service can reach it.
  entra-sidecar:
    # Built locally from a pinned upstream commit (sidecar/Containerfile) because the MCR image is
    # amd64 only; Azure uses mcr.microsoft.com/entra-sdk/auth-sidecar.
    image: localhost/entra-sidecar:local
    build:
      context: ./sidecar
      dockerfile: Containerfile
    env_file:
      - path: .secrets/sidecar.env
        required: false
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:5000
      AllowedHosts: localhost;127.0.0.1
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${TENANT_ID:-}
      AzureAd__ClientId: ${BLUEPRINT_APP_ID:-}
      AzureAd__Audience: ${BLUEPRINT_APP_ID:-}
      AzureAd__Scopes: access_as_user
      # Local development only: the Blueprint dev secret from .secrets/sidecar.env. Azure uses a
      # federated credential from the managed identity instead.
      AzureAd__ClientCredentials__0__SourceType: ClientSecret
      DownstreamApis__HealthMcp__BaseUrl: http://health-mcp:8001/
      DownstreamApis__HealthMcp__Scopes__0: api://${HEALTH_MCP_APP_ID:-}/.default
      DownstreamApis__HealthMcp__RequestAppToken: "false"
      # ASI07 baseline: autonomous (app-only) token for the report agent, as the chat agent identity.
      DownstreamApis__ReportApi__BaseUrl: http://report-agent:8002/
      DownstreamApis__ReportApi__Scopes__0: api://${REPORT_API_APP_ID:-}/.default
      DownstreamApis__ReportApi__RequestAppToken: "true"
      # Upstream master ignores AgentIdentity on the unauthenticated route unless overrides are allowed there
      # (default false), and the Blueprint then asks for the token itself (AADSTS82001). Only chat-api can reach
      # this sidecar (shared loopback), so allowing overrides on that route exposes nothing new.
      Sidecar__AllowOverrides__GetAuthorizationHeaderUnauthenticated: "true"
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.Identity.Web: Information
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: service:chat-api
    depends_on:
      - chat-api

  # STAGE-ONLY identity simulator (ADR-0018). Offline profile only, host access on 127.0.0.1 only.
  local-issuer:
    <<: *app
    profiles: [offline]
    command: ["python", "-m", "local_issuer"]
    ports:
      - "127.0.0.1:8100:8100"
    networks: [identity]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  az-login:
    <<: *app
    profiles: [login]
    command: ["az", "login", "--use-device-code", "--tenant", "${TENANT_ID:-}"]
    read_only: false
    volumes:
      - azcli-cache:/home/app/.azure
    networks: [app]

networks:
  app: {}
  identity: {}

volumes:
  azcli-cache: {}
  # Unix socket between report-agent and chart-runner, owned by UID 10001 (OQ-13).
  chart-socket:
    driver_opts:
      o: "uid=10001,gid=10001"
  # ASI07: A2A signing key (chat-api only) and its public key (report-agent only), written by a2a-keys.
  a2a-signing:
    driver_opts:
      o: "uid=10001,gid=10001"
  a2a-verify:
    driver_opts:
      o: "uid=10001,gid=10001"
