# ASI02: tool governance for the chat agent. Versioned with the code and loaded at startup.
# AGT GovernancePolicy takes name, max_tool_calls, and allowed_tools; denied_tools are glob patterns
# enforced by the tool policy middleware on top of the allowlist.
name: biotrackr-chat-agent
agent_id: biotrackr-owasp-chat-agent

# Tool calls per conversation (signed-in oid + session id), reserved atomically per model batch.
max_tool_calls: 20

# Argument policy: a batch asking for more than this page_size is aborted (the MCP server also clamps).
max_page_size: 50

allowed_tools:
  - get_activity_by_date
  - get_activity_by_date_range
  - get_activity_records
  - get_food_by_date
  - get_food_by_date_range
  - get_food_records
  - get_sleep_by_date
  - get_sleep_by_date_range
  - get_sleep_records
  - get_vitals_by_date
  - get_vitals_by_date_range
  - get_vitals_records
  # ASI05, ASI07, ASI09 (S3): report agent over A2A.
  - generate_report
  - check_report_status

# Per-conversation caps for single tools, counted with the call budget (MAF max_invocations is process-wide).
tool_limits:
  generate_report: 2

# ASI09: the user approves these calls before they run (MAF approval_mode=always_require, AG-UI interrupt).
approval_required:
  - generate_report

denied_tools:
  - "*delete*"
  - "*update*"
  - "*write*"
  - "*admin*"

# ASI08: model tokens per conversation (signed-in oid + session id) and per reply.
max_tokens_per_conversation: 400000
max_output_tokens: 2000

# ASI10: rogue detection per signed-in user. Each user gets an own AGT RogueAgentDetector (quarantine at
# this risk level) plus a ceiling on executed tool calls across all of that user's conversations. The ceiling sits
# above max_tool_calls, so one conversation cannot trip it. A quarantine lasts quarantine_seconds for that user only.
rogue_detection:
  burst_limit: 50
  burst_window_seconds: 120
  quarantine_seconds: 300
  quarantine_risk_level: critical
  frequency_window_seconds: 60
  frequency_min_windows: 10
