# ASI04 (S5): keep every pin current. Updates arrive as pull requests, so CI (lock, lint, tests, SBOM, mcp-scan,
# ASI07 red team) runs on each bump before anything merges. Dependabot cannot see the sidecar image in
# solution/infra/modules/chat_api.bicep or the ARG-based FROM lines in solution/sidecar/Containerfile; bump those by
# hand (solution/README.md, Supply chain).
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/starter", "/solution", "/client", "/redteam"]
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Containerfiles (tag and digest pins) and Compose service images.
  - package-ecosystem: docker
    directories: ["/starter", "/solution"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ["/starter", "/solution"]
    schedule:
      interval: weekly
