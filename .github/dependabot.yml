# ASI04 (S5): keep every pin current. Updates arrive as pull requests, so CI (lock, lint, tests, SBOM, mcp-scan,
# ASI07 red team) runs on each bump before anything merges. Dependabot cannot see the sidecar image in
# solution/infra/modules/chat_api.bicep or the ARG-based FROM lines in solution/sidecar/Containerfile; bump those by
# hand (solution/README.md, Supply chain).
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/starter", "/solution", "/client", "/redteam"]
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # agent-framework 1.22.0 declares mcp<2; the 2.x client API breaks MAF's MCP tool. The starter has no tests, so
    # CI cannot catch this there. Remove once MAF supports mcp 2.
    ignore:
      - dependency-name: mcp
        versions: [">=2"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Browser UI (S7). The cooldown mirrors .npmrc min-release-age=7, so fresh releases wait a week.
  - package-ecosystem: npm
    directory: "/solution/ui"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # Harness dev tooling (typescript, @types/node). The cooldown mirrors .harness/.npmrc min-release-age=7.
  - package-ecosystem: npm
    directory: "/.harness"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      harness:
        patterns: ["*"]

  # Containerfiles (tag and digest pins) and Compose service images.
  - package-ecosystem: docker
    directories: ["/starter", "/solution", "/solution/ui"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ["/starter", "/solution"]
    schedule:
      interval: weekly
