# ASI04 (S5): supply-chain evidence on every push and pull request. Every action is pinned by full commit SHA
# (the comment is the release it came from; Dependabot bumps both). Read-only token, no pull_request_target, and
# no Azure credentials: the stack job runs in offline identity mode and its red-team step is model-free (ASI07).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lock, lint, test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [starter, solution, client, redteam]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install exactly what uv.lock pins
        run: uv sync --locked
      - name: ruff check
        run: uv run --locked ruff check
      - name: ruff format --check
        run: uv run --locked ruff format --check
      - name: pytest
        if: hashFiles(format('{0}/tests/**/*.py', matrix.project)) != ''
        run: uv run --locked pytest -q

  sbom:
    name: SBOM and dependency scan (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [starter, solution, client, redteam]
        include:
          # The browser client; its path has a slash, so the artefact name is set explicitly.
          - project: solution/ui
            artifact: sbom-solution-ui.spdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ matrix.project }}
          format: spdx-json
          syft-version: v1.55.0
          output-file: ${{ runner.temp }}/sbom.spdx.json
          artifact-name: ${{ matrix.artifact || format('sbom-{0}.spdx.json', matrix.project) }}
          # Submitting to the dependency graph needs contents: write; the artefact is the evidence here.
          dependency-snapshot: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Download vulnerability database (one retry)
        run: |
          trivy image --download-db-only || {
            sleep 5
            trivy image --download-db-only
          }
      - name: Gate high and critical dependency vulnerabilities
        env:
          SBOM_PATH: ${{ runner.temp }}/sbom.spdx.json
        run: |
          trivy sbom "$SBOM_PATH" --skip-db-update \
            --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile "$GITHUB_WORKSPACE/.trivyignore.yaml"

  image-scan:
    name: image scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: runtime
            context: solution
            file: solution/Containerfile
            target: runtime
          - name: chart-runner
            context: solution
            file: solution/chart_runner.Containerfile
            target: ""
          - name: chat-ui
            context: solution/ui
            file: solution/ui/Containerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deployable image (no push)
        env:
          BUILD_CONTEXT: ${{ matrix.image.context }}
          BUILD_FILE: ${{ matrix.image.file }}
          BUILD_TARGET: ${{ matrix.image.target }}
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          args=()
          if [[ -n "$BUILD_TARGET" ]]; then
            args+=(--target "$BUILD_TARGET")
          fi
          docker build "${args[@]}" --file "$BUILD_FILE" \
            --tag "biotrackr-$IMAGE_NAME:ci" "$BUILD_CONTEXT"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Download vulnerability database (one retry)
        run: |
          trivy image --download-db-only || {
            sleep 5
            trivy image --download-db-only
          }
      - name: Gate high and critical image vulnerabilities
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          trivy image "biotrackr-$IMAGE_NAME:ci" --skip-db-update --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile "$GITHUB_WORKSPACE/.trivyignore.yaml"

  infra-guard:
    name: no stage-only identity in Azure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-0018: the local issuer is a stage-only simulator. Nothing deployed to Azure may reference it.
      - name: local_issuer is absent from infra/ and azure.yaml
        run: |
          if grep -rniE 'local[_-]issuer' solution/infra solution/azure.yaml; then
            echo "::error::local_issuer is referenced by Azure infrastructure"
            exit 1
          fi
          echo "no local_issuer reference in solution/infra or solution/azure.yaml"
      # The Agent Framework DevUI is a local debugging UI with no auth; it must never be deployed.
      - name: DevUI is absent from infra/ and azure.yaml
        run: |
          if grep -rniE 'devui' solution/infra solution/azure.yaml; then
            echo "::error::DevUI is referenced by Azure infrastructure"
            exit 1
          fi
          echo "no DevUI reference in solution/infra or solution/azure.yaml"

  web:
    name: browser UI (lint, types, tests, e2e, headers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: solution/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      # Exact lockfile, no install scripts; .npmrc enforces the engine and the 7-day release cooldown.
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: lint (XSS bans included)
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: unit and component tests
        run: npm test
      - name: production build
        run: npm run build
      # The e2e stub AuthProvider must never ship.
      - name: production build has no e2e stub
        run: |
          if grep -rq 'biotrackr-e2e-stub-auth-provider' dist; then
            echo "::error::the e2e stub AuthProvider is in the production build"
            exit 1
          fi
          echo "dist/ has no e2e stub"
      - name: Playwright browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: solution/ui/playwright-report
          retention-days: 7
      # nginx sets the CSP and the other headers; vite preview does not, so check the real image.
      - name: Image serves the security headers
        run: |
          docker build -f Containerfile -t chat-ui:ci .
          docker run -d --name chat-ui -p 127.0.0.1:8080:8080 \
            -e TENANT_ID=00000000-0000-4000-8000-000000000001 \
            -e SPA_APP_ID=00000000-0000-4000-8000-000000000002 \
            -e BLUEPRINT_APP_ID=00000000-0000-4000-8000-000000000003 \
            -e CHAT_API_URL=https://chat-api.example.invalid \
            chat-ui:ci
          for _ in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          root="$(curl -fsSI http://127.0.0.1:8080/)"
          config="$(curl -fsSI http://127.0.0.1:8080/config.json)"
          printf '%s\n' "${root}"
          expect() {
            if ! printf '%s\n' "$1" | grep -qiF "$2"; then
              echo "::error::missing header: $2"
              exit 1
            fi
          }
          expect "${root}" "content-security-policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://login.microsoftonline.com https://chat-api.example.invalid; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'"
          expect "${root}" "x-frame-options: DENY"
          expect "${root}" "referrer-policy: no-referrer"
          expect "${root}" "x-content-type-options: nosniff"
          expect "${config}" "cache-control: no-store"
          test "$(docker exec chat-ui id -u)" != "0"
          curl -fs http://127.0.0.1:8080/config.json | python3 -c 'import json, sys; c = json.load(sys.stdin); assert sorted(c) == ["blueprintAppId", "chatApiUrl", "spaAppId", "tenantId"], c'
      - name: Stop the image
        if: always()
        run: docker rm -f chat-ui || true

  stack:
    name: offline stack (mcp-scan, ASI07 red team)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Podman's compose wrapper with Docker Compose v2 (preinstalled on the runner) as the provider.
      PODMAN_COMPOSE_PROVIDER: /usr/libexec/docker/cli-plugins/docker-compose
      PODMAN_COMPOSE_WARNING_LOGS: "false"
      IDENTITY_MODE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: redteam/uv.lock
      - name: Podman socket for the Compose provider
        run: |
          systemctl --user start podman.socket
          podman version
          "$PODMAN_COMPOSE_PROVIDER" version
      - name: Offline .env (stage-only IDs, no Azure)
        working-directory: solution
        run: |
          cp .env.example .env
          for key in TENANT_ID BLUEPRINT_APP_ID CHAT_AGENT_APP_ID HEALTH_MCP_APP_ID REPORT_API_APP_ID CLI_APP_ID ALICE_OID BOB_OID; do
            sed -i "s|^${key}=.*|${key}=$(uuidgen)|" .env
          done
          sed -i 's|^IDENTITY_MODE=.*|IDENTITY_MODE=local|' .env
          sed -i 's|^FOUNDRY_PROJECT_ENDPOINT=.*|FOUNDRY_PROJECT_ENDPOINT=https://ci.invalid/api/projects/ci|' .env
      # The Entra sidecar is not started (no Entra in CI). The images build for amd64 here, arm64 on a Mac.
      - name: Build and start (offline profile)
        working-directory: solution
        run: podman compose --profile offline up -d --build --wait --wait-timeout 600 chat-api local-issuer
      - name: mcp-scan against health-mcp (AGT)
        working-directory: solution
        run: podman exec -i biotrackr-solution-chat-api-1 python - < scripts/ci_mcp_scan.py
      - name: Red team, ASI07 (model-free, deterministic)
        working-directory: redteam
        run: uv run --locked python -m redteam.run --target solution-offline --risk ASI07
      - name: Compose logs
        if: failure()
        working-directory: solution
        run: |
          podman ps -a --format '{{.Names}}\t{{.Status}}'
          for c in $(podman ps -a --format '{{.Names}}'); do
            echo "== $c health"; podman inspect --format '{{json .State.Health}}' "$c" | head -c 1500; echo
          done
          podman exec biotrackr-solution-chart-runner-1 ls -la /sockets/chart || true
          podman exec biotrackr-solution-chart-runner-1 id || true
          podman volume inspect biotrackr-solution_chart-socket || true
          podman compose --profile offline logs --no-color --tail 200
      - name: Stop
        if: always()
        working-directory: solution
        run: podman compose --profile offline down --volumes
