name: Feature request
description: Suggest a new control, attack, or feature for the sample.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Read [CONTRIBUTING.md](https://github.com/willvelida/owasp-agents-sample/blob/main/CONTRIBUTING.md) first. You can wait for feedback here before you start, or open a pull request from your fork that links this issue to show a working version.

        Don't include secrets, keys, tenant or subscription IDs, endpoint URLs, or real health data. This issue is public.
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What can't the sample show or do today? Name the OWASP Agentic risk (ASI01 to ASI10) if it applies.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change? Say whether it affects the starter, the solution, or both.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which parts of the repository would change?
      multiple: true
      options:
        - starter
        - solution
        - solution/ui
        - client
        - redteam
        - data/seed
        - docs
        - CI
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, and why you prefer your proposal.
    validations:
      required: false
  - type: checkboxes
    id: implement
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this.
          required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      description: By opening this issue, you agree to follow the [Code of Conduct](https://github.com/willvelida/owasp-agents-sample/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I searched existing issues and read CONTRIBUTING.md.
          required: true
