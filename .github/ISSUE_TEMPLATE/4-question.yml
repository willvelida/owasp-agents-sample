name: Question
description: Ask how something in the sample works or why it was built that way.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/willvelida/owasp-agents-sample/blob/main/README.md), the component guides, and the [architecture decision records](https://github.com/willvelida/owasp-agents-sample/blob/main/docs/adr/README.md) first. Many "why" questions are answered there.

        Don't include secrets, keys, tenant or subscription IDs, endpoint URLs, or real health data. This issue is public.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried or read
      description: Docs you checked, commands you ran, or what you expected.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - starter
        - solution
        - solution/ui
        - client
        - redteam
        - data/seed
        - docs
        - CI
        - General
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      description: By opening this issue, you agree to follow the [Code of Conduct](https://github.com/willvelida/owasp-agents-sample/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I searched existing issues and read CONTRIBUTING.md.
          required: true
