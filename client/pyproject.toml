[project]
name = "biotrackr-client"
version = "0.1.0"
description = "CLI client for the Biotrackr chat agent over AG-UI (starter and solution targets)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "rich==14.2.0",
]

[project.scripts]
biotrackr-chat = "biotrackr_client.cli:main"

[dependency-groups]
dev = ["ruff==0.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biotrackr_client"]

[tool.hatch.build.targets.wheel.force-include]
"targets.toml" = "biotrackr_client/targets.toml"

[tool.ruff]
extend = "../ruff.toml"
